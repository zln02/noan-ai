<script>
/* 도구 승인 현황 — approval.json 을 읽어 표를 그린다. 외부 요청 없음 */
(function () {
  'use strict';
  var STATE = {
    '사용 중':  { cls: 'state-ok',   sym: '●' },
    '시범 중':  { cls: 'state-try',  sym: '◐' },
    '심의 대기': { cls: 'state-hold', sym: '◌' },
    '확인 중':  { cls: 'state-wait', sym: '?' },
    '불가':     { cls: 'state-no',   sym: '✕' }
  };
  var COLS = ['도구명', '대상', '상태', '근거', '서버', '학생계정', '동의14', '비고'];
  var HEAD = { '학생계정': '학생 계정', '동의14': '만14세 동의' };
  var box = document.getElementById('approvalTable');

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  var NOWRAP = { '대상': 1, '상태': 1, '서버': 1, '학생계정': 1, '동의14': 1 };

  function cell(row, key) {
    var v = row[key];
    var nw = NOWRAP[key] ? ' nw' : '';
    if (key === '상태') {
      var st = STATE[v] || { cls: '', sym: '·' };
      return '<td class="' + st.cls + nw + '"><span class="state-sym" aria-hidden="true">' +
        st.sym + '</span>' + esc(v) + '</td>';
    }
    if (typeof v === 'boolean') return '<td class="' + nw.trim() + '">' + (v ? '필요' : '해당 없음') + '</td>';
    return '<td class="' + nw.trim() + '">' + esc(v == null ? '' : v) + '</td>';
  }

  function render(rows) {
    var h = '<div class="tw"><table><thead><tr>';
    for (var c = 0; c < COLS.length; c++) {
      h += '<th scope="col" class="nw">' + esc(HEAD[COLS[c]] || COLS[c]) + '</th>';
    }
    h += '</tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++) {
      h += '<tr><th scope="row">' + esc(rows[i]['도구명']) + '</th>';
      for (var j = 1; j < COLS.length; j++) h += cell(rows[i], COLS[j]);
      h += '</tr>';
    }
    h += '</tbody></table></div>';
    box.innerHTML = h;
  }

  function fail() {
    box.innerHTML = '<p class="muted">표를 불러오지 못했습니다. ' +
      '<a href="approval.json">approval.json</a> 을 직접 여세요.</p>';
  }

  /* file:// 로 열면 크롬이 fetch 를 막는다. 그때는 approval.js 가 실어둔
     같은 내용(window.APPROVAL_DATA)으로 그린다. tools/sync-data.js 가 둘을 맞춘다. */
  function fallback() {
    if (window.APPROVAL_DATA) { render(window.APPROVAL_DATA); return true; }
    return false;
  }

  if (!window.fetch) { if (!fallback()) fail(); return; }
  fetch('approval.json')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(render)
    .catch(function () { if (!fallback()) fail(); });
})();
</script>
