<style>
  body{background:#f8f6f1;color:#13202a;word-break:keep-all;overflow-wrap:break-word}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 24px 90px}
  .back{display:inline-block;color:#0a7779;font-weight:700;text-decoration:none;margin-bottom:28px}

  .card ol,.card ul{padding-left:24px;margin:0}
  .card li+li{margin-top:8px}
  .shot{width:100%;border-radius:12px;border:1px solid #d8d5cc;margin-top:16px}
  .prompt{background:#f8f6f1;border-left:5px solid #20b6b0;padding:17px;border-radius:0 12px 12px 0;white-space:pre-wrap}
  .note-hero{font-size:16px;color:#c9d3d8;margin:14px 0 0}
