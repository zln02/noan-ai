<script>

  (function(){
    function watch(){
      document.querySelectorAll('video[data-scene-video]').forEach(function(v){
        if (v.dataset.bound) return;
        v.dataset.bound = '1';
        var show = function(){
          if (v.videoWidth > 0) {
            v.setAttribute('data-ready','');
            if (v.nextElementSibling && v.nextElementSibling.hasAttribute('data-video-controls')) v.nextElementSibling.setAttribute('data-ready','');
          }
        };
        var bar = v.nextElementSibling;
        var sync = function(){
          if (!bar) return;
          bar.querySelector('[data-vc-play]').style.display = v.paused ? '' : 'none';
          bar.querySelector('[data-vc-pause]').style.display = v.paused ? 'none' : '';
        };
        v.addEventListener('play', sync);
        v.addEventListener('pause', sync);
        if (bar && bar.hasAttribute('data-video-controls')) {
          bar.querySelector('[data-vc="toggle"]').addEventListener('click', function(){
            if (v.paused) { v.play(); } else { v.pause(); }
          });
          var basestyle0 = v.getAttribute('style');
          var barstyle0 = bar.getAttribute('style');
          var expand = function(on){
            if (on) {
              v.setAttribute('style', 'position:absolute;left:0px;top:0px;width:1280px;height:720px;border-radius:0;object-fit:contain;display:block;background:#0b1220;border:0;z-index:60;visibility:visible');
              bar.style.left = '1136px';
              bar.style.top = '644px';
              bar.style.setProperty('z-index', '61');
            } else {
              v.setAttribute('style', basestyle0);
              bar.setAttribute('style', barstyle0);
            }
            bar.querySelector('[data-vc-open]').style.display = on ? 'none' : '';
            bar.querySelector('[data-vc-close]').style.display = on ? '' : 'none';
            v.dataset.expanded = on ? '1' : '';
          };
          bar.querySelector('[data-vc="full"]').addEventListener('click', function(){
            if (document.fullscreenElement) { document.exitFullscreen(); return; }
            if (v.dataset.expanded) { expand(false); return; }
            var req = v.requestFullscreen || v.webkitRequestFullscreen || v.webkitEnterFullscreen;
            var ok = document.fullscreenEnabled && req;
            if (!ok) { expand(true); return; }
            try {
              var p = req.call(v);
              if (p && p.catch) { p.catch(function(){ expand(true); }); }
            } catch (e) { expand(true); }
          });
          document.addEventListener('keydown', function(e){
            if (e.key === 'Escape' && v.dataset.expanded) { expand(false); }
          });
        }
        v.addEventListener('loadeddata', function(){ sync(); });
        v.addEventListener('loadeddata', show);
        v.addEventListener('error', function(){
          v.removeAttribute('data-ready');
          if (v.nextElementSibling && v.nextElementSibling.hasAttribute('data-video-controls')) v.nextElementSibling.removeAttribute('data-ready');
        });
        show();
      });
    }
    function bindentry0(){
      document.querySelectorAll('section[data-label]').forEach(function(sec){
        if (sec.dataset.vidobs) return;
        var v = sec.querySelector('video[data-scene-video]');
        if (!v) return;
        sec.dataset.vidobs = '1';
        new MutationObserver(function(){
          if (sec.hasAttribute('data-deck-active')) {
            v.pause();
            try { v.currentTime = 0; } catch (e) {}
          } else { v.pause(); }
        }).observe(sec, { attributes: true });
      });
    }
    bindentry0();
    [400, 1200, 3000].forEach(function(t){ setTimeout(bindentry0, t); });
    watch();
    addEventListener('load', watch);
    [400, 1200, 3000].forEach(function(t){ setTimeout(watch, t); });
  })();
</script>
