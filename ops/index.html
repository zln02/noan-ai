  </div>

<script src="../data/schedule.js"></script>

<script>
/* 다음 연수 D-day — 랜딩(index.html)의 scheduleBadge 계산식을 그대로 옮겨 이 쪽에 둔다 */
(function () {
  'use strict';
  var el = document.getElementById('nextTraining');
  if (!el) return;
  var WD = ['일', '월', '화', '수', '목', '금', '토'];
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function render(items) {
    if (!items || !items.length) { el.textContent = '연수 일정이 없습니다.'; return; }
    var now = new Date();
    var todayKey = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
    var todayMid = new Date(todayKey);
    var withDates = items
      .filter(function (it) { return it && it.date; })
      .map(function (it) { return { it: it, dMid: new Date(it.date) }; })
      .filter(function (x) { return !isNaN(x.dMid.getTime()); })
      .sort(function (a, b) { return a.dMid - b.dMid; });
    var next = null;
    for (var i = 0; i < withDates.length; i++) {
      if (withDates[i].dMid >= todayMid) { next = withDates[i]; break; }
    }
    if (!next) {
      el.className = 'dday is-past';
      el.textContent = '지난 연수';
      return;
    }
    var diffDays = Math.round((next.dMid - todayMid) / 86400000);
    var dLabel = diffDays === 0 ? '오늘' : ('D-' + diffDays);
    var mmdd = (next.dMid.getMonth() + 1) + '/' + next.dMid.getDate() + '(' + WD[next.dMid.getDay()] + ')';
    var level = diffDays <= 7 ? 'is-urgent' : (diffDays <= 30 ? 'is-soon' : 'is-wait');
    el.className = 'dday ' + level;
    el.textContent = dLabel + ' · ' + mmdd + ' ' + (next.it.time || '') + ' ' + (next.it.title || '');
  }
  function fallback() { if (window.SCHEDULE_DATA) { render(window.SCHEDULE_DATA); return true; } return false; }
  if (!window.fetch) { fallback(); return; }
  fetch('../data/schedule.json')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(render)
    .catch(function () { fallback(); });
})();
</script>
<script>
/* 최근 기록 5건 — log.json 을 날짜 역순으로 5건만 */
(function () {
  'use strict';
  var box = document.getElementById('recentLog');
  if (!box) return;
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function empty() {
    box.innerHTML = '<p class="muted">아직 기록이 없습니다. <code>node tools/sync-notion.js</code> 로 노션에서 내려받습니다.</p>';
  }
  function render(items) {
    if (!items || !items.length) { empty(); return; }
    var sorted = items.slice().sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')); });
    var top = sorted.slice(0, 5);
    var h = '<ul class="plain">';
    for (var i = 0; i < top.length; i++) {
      var it = top[i];
      h += '<li>';
      if (it.kind) h += '<span class="badge">' + esc(it.kind) + '</span> ';
      h += '<strong>' + esc(it.title || '(제목 없음)') + '</strong> ';
      h += '<span class="muted small">' + esc(it.date || '') + (typeof it.minutes === 'number' ? ' · ' + it.minutes + '분' : '') + '</span>';
      h += '</li>';
    }
    h += '</ul>';
    box.innerHTML = h;
  }
  function fallback() { if (window.LOG_DATA) { render(window.LOG_DATA); return true; } return false; }
  if (!window.fetch) { if (!fallback()) empty(); return; }
  fetch('../data/log.json')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(render)
    .catch(function () { if (!fallback()) empty(); });
})();
</script>
<script>
/* 이번 달 근무 시간 — 이번 달 기록의 minutes 합 ÷ 60, 계약 200시간 대비 막대 */
(function () {
  'use strict';
  var bar = document.getElementById('hourMeter');
  var label = document.getElementById('hourLabel');
  if (!bar || !label) return;
  var CONTRACT_HOURS = 200;
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function render(items) {
    var now = new Date();
    var ym = now.getFullYear() + '-' + pad(now.getMonth() + 1);
    var minutes = 0;
    for (var i = 0; i < (items || []).length; i++) {
      var it = items[i];
      if (it && typeof it.date === 'string' && it.date.indexOf(ym) === 0 && typeof it.minutes === 'number') {
        minutes += it.minutes;
      }
    }
    var hours = minutes / 60;
    var rawPct = (hours / CONTRACT_HOURS) * 100;
    bar.style.width = Math.min(100, rawPct).toFixed(1) + '%';
    bar.parentNode.classList.toggle('is-over', hours > CONTRACT_HOURS);
    label.textContent = '계약 200시간 · 이번 달 ' + hours.toFixed(1) + '시간 (' + rawPct.toFixed(1) + '%)';
  }
  function fallback() { if (window.LOG_DATA) { render(window.LOG_DATA); return true; } return false; }
  if (!window.fetch) { if (!fallback()) render([]); return; }
  fetch('../data/log.json')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(render)
    .catch(function () { if (!fallback()) render([]); });
})();
</script>
<script>
/* 미해결 — docs/handover.md 에서 "미해결" 이 들어간 절의 목록 항목만 그대로 보여준다 */
(function () {
  'use strict';
  var box = document.getElementById('openIssues');
  if (!box) return;
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function extractSection(text) {
    var lines = text.split(/\r?\n/);
    var buf = [];
    var inSection = false;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^#{1,6}\s/.test(line)) {
        if (line.indexOf('미해결') !== -1) { inSection = true; continue; }
        if (inSection) { break; }
      }
      if (inSection) buf.push(line);
    }
    return buf.join('\n');
  }
  function itemsFromMarkdown(section) {
    var lines = section.split(/\r?\n/);
    var items = [];
    for (var i = 0; i < lines.length; i++) {
      var m = /^\s*[-*]\s+(.*)$/.exec(lines[i]);
      if (m) items.push(m[1].trim());
    }
    return items;
  }
  function render(text) {
    var items = itemsFromMarkdown(extractSection(text));
    if (!items.length) {
      box.innerHTML = '<p class="muted">docs/handover.md 에 「미해결」로 시작하는 절이 없습니다.</p>';
      return;
    }
    var h = '<ul class="plain">';
    for (var i = 0; i < items.length; i++) h += '<li>' + esc(items[i]) + '</li>';
    h += '</ul>';
    box.innerHTML = h;
  }
  function fail() {
    box.innerHTML = '<p class="muted"><a href="../docs/handover.md">docs/handover.md 열기</a> — 이 화면에서 자동으로 읽지 못했습니다.</p>';
  }
  if (!window.fetch) { fail(); return; }
  fetch('../docs/handover.md')
    .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
    .then(render)
    .catch(fail);
})();
</script>
<script src="../shared/site.js"></script>
</body>
